name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          # One macOS job to catch platform-specific NetCDF/HDF5 problems.
          - os: macos-latest
            python-version: "3.13"

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install the package and its test dependencies
        run: uv sync --extra test --python ${{ matrix.python-version }}

      - name: Run the test suite
        # The suite is network-free; it runs against the ERA5 extraction
        # committed under casegen_walnut_gulch/data.
        run: uv run --python ${{ matrix.python-version }} pytest -v

      - name: Check that the CLI is installed and runnable
        run: uv run --python ${{ matrix.python-version }} era5-scm-tool --help

  build:
    name: build the distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build the wheel and sdist
        run: uv build

      - name: Verify the metadata
        run: |
          uv tool run twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: distribution
          path: dist/
