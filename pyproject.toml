[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "era5-to-ccpp-scm-tool"
version = "0.0.0"
description = "A small command line tool for generating CCPP SCM inputs from ERA5 data"
authors = [
    { name = "Andrew Bennett", email = "andrbenn@arizona.edu" },
]
dependencies = [
    "click>=8.0.0",
    "xarray",
    "metpy",
    "numpy",
    "pandas",
    # NetCDF I/O engines. Without at least one of these xarray cannot open
    # any of the files this tool reads or writes.
    "netcdf4",
    "h5netcdf",
    "h5py",
    # Anonymous access to the NSF NCAR ERA5 archive on S3.
    "s3fs",
    "fsspec",
    "aiohttp",
]
requires-python = ">=3.9"
readme = "README.md"

[project.scripts]
era5-scm-tool = "era5_to_ccpp_scm.cli:cli"  # This makes your script executable

[tool.hatch.build.targets.wheel]
packages = ["era5_to_ccpp_scm"]